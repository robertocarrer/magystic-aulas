name: Vídeo diário das aulas

on:
  schedule:
    - cron: '23 8 * * *'   # todo dia às 05:23 (Brasília)
  workflow_dispatch:
    inputs:
      aulas:
        description: 'Números das aulas, separados por espaço (vazio = as próximas pendentes)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: aulas
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q pillow
          mkdir -p fontes
          curl -sSfL -o fontes/Fraunces.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/fraunces/Fraunces%5BSOFT,WONK,opsz,wght%5D.ttf"
          curl -sSfL -o fontes/Jost.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/jost/Jost%5Bwght%5D.ttf"
          curl -sSfL -A "Mozilla/5.0 (magystic-aulas)" -o logo.png https://magystic.com/logo.png
      - name: Gerar e enviar os vídeos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AULAS: ${{ github.event.inputs.aulas }}
        run: python gerar.py
      - name: Guardar cópia dos vídeos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: saida/*.mp4
          retention-days: 14
          if-no-files-found: ignore
